],comments:[]},{id:"po3",userId:"u5",time:["il y a 6 h","6h ago"],likes:51,likedBy:[],text:["Aper\xE7u de notre \xE9tude de reconversion : une \xE9glise de 1923 \xE0 Hochelaga, 24 lofts, nef pr\xE9serv\xE9e. Le projet cherche un\xB7e ing\xE9nieur\xB7e en structure amoureux\xB7se du patrimoine. D\xE9tails dans Projets & \xC9quipes.","Preview of our conversion study: a 1923 church in Hochelaga, 24 lofts, nave preserved. The project is looking for a heritage-minded structural engineer. Details in Projects & Teams."],comments:[{id:"c2",userId:"u9",text:["Les charpentes de cette \xE9poque r\xE9servent de belles surprises. Je vais regarder \xE7a.","Timber frames from that era hold nice surprises. I'll take a look."]}],linkTo:{page:"project",id:"pr2"}},{id:"po4",userId:"u4",time:["Commandit\xE9","Sponsored"],likes:12,likedBy:[],sponsored:!0,text:["Taux 5 ans assur\xE9s \xE0 partir de 4,39 % cette semaine chez nos 22 pr\xEAteurs (exemple fictif). Un immeuble \xE0 revenus se qualifie diff\xE9remment d'une r\xE9sidence : parlons structure avant de parler taux.","Insured 5-year rates from 4.39% this week across our 22 lenders (fictional example). An income property qualifies differently from a home: let's talk structure before rate."],comments:[],cta:{label:["Demander une soumission","Request a quote"],userId:"u4"}},{id:"po5",userId:"u8",time:["hier","yesterday"],likes:68,likedBy:[],text:["Le Quartier des Bassins franchit 65 % de souscription. Merci aux 40 premiers investisseurs \u2014 la pr\xE9location d\xE9marre avec 3 mois d'avance. Nous co-investissons 10 % de l'\xE9quit\xE9, comme sur chacun de nos projets.","Le Quartier des Bassins crosses 65% subscribed. Thanks to our first 40 investors \u2014 pre-leasing starts 3 months early. We co-invest 10% of the equity, as on every project."],comments:[{id:"c3",userId:"u3",text:["Contente d'\xEAtre du voyage.","Glad to be aboard."]}],linkTo:{page:"deal",id:"o1"}},{id:"po6",userId:"u7",time:["hier","yesterday"],likes:22,likedBy:[],text:["Vices cach\xE9s : la garantie l\xE9gale n'est pas un slogan. Vendre \xAB sans garantie l\xE9gale, aux risques et p\xE9rils de l'acheteur \xBB r\xE9duit le prix de 3 \xE0 8 % en pratique (observation fictive). Chiffrez ce que vous signez.","Latent defects: the legal warranty is not a slogan. Selling \u201Cwithout legal warranty, at the buyer's risk\u201D costs 3\u20138% of price in practice (fictional observation). Price what you sign."],comments:[]},{id:"po7",userId:"u11",time:["il y a 2 jours","2 days ago"],likes:15,likedBy:[],text:["Question aux propri\xE9taires de 6 \xE0 24 logements : confiez-vous la reddition de comptes mensuelle \xE0 votre gestionnaire ou \xE0 votre comptable? On voit les deux mod\xE8les et les co\xFBts varient du simple au double.","Question for 6-to-24-unit owners: does your manager or your accountant handle monthly reporting? We see both models and costs vary twofold."],comments:[{id:"c4",userId:"u1",text:["Gestionnaire pour l'op\xE9rationnel, comptable pour la fiscalit\xE9. Les m\xE9langer co\xFBte cher.","Manager for operations, accountant for tax. Mixing them is expensive."]}]},{id:"po8",userId:"u9",time:["il y a 2 jours","2 days ago"],likes:31,likedBy:[],text:["Sur\xE9lever un triplex de 1910? V\xE9rifiez d'abord les fondations en moellons et la capacit\xE9 des murs porteurs \u2014 40 % des projets qu'on \xE9tudie s'arr\xEAtent l\xE0. Une visite exploratoire co\xFBte moins cher qu'un permis abandonn\xE9.","Adding a storey to a 1910 triplex? Check the rubble foundations and load-bearing walls first \u2014 40% of the projects we study stop there. An exploratory visit costs less than an abandoned permit."],comments:[]},{id:"po9",userId:"u14",time:["il y a 3 jours","3 days ago"],likes:19,likedBy:[],text:["Je cherche 2 ou 3 projets en amor\xE7age (id\xE9e \xE0 plans) dans Montr\xE9al pour des tickets de 25 \xE0 150 k$. Ce qui me convainc : un porteur qui conna\xEEt son quartier et un budget honn\xEAte. \xC9crivez-moi ou passez par Pro
